<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Most Used Programming Languages</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1e2028;
    --surface: #252830;
    --border: #333744;
    --bar: #38bdf8;
    --bar-glow: rgba(56, 189, 248, 0.25);
    --text-primary: #f0f4ff;
    --text-muted: #8892a4;
    --accent: #38bdf8;

    --cat-web: #a78bfa;
    --cat-data: #34d399;
    --cat-shell: #fb923c;
    --cat-system: #f472b6;
    --cat-general: #fbbf24;
    --cat-ms: #60a5fa;
  }

  body {
    background: var(--bg);
    font-family: 'Syne', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px;
  }

  .container {
    width: 100%;
    max-width: 860px;
  }

  .header {
    margin-bottom: 36px;
  }

  .header h1 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #c8d0e0;
  }

  .header p {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: #7a8499;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    margin-bottom: 28px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  /* Table header */
  .table-head {
    display: grid;
    grid-template-columns: 160px 130px 1fr 64px;
    gap: 0 16px;
    padding: 0 16px 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .col-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
  }

  /* Rows */
  .row {
    display: grid;
    grid-template-columns: 160px 130px 1fr 64px;
    gap: 0 16px;
    align-items: center;
    padding: 9px 16px;
    border-bottom: 1px dashed #2a2f3e;
    transition: background 0.15s;
  }

  .row:hover {
    background: rgba(255,255,255,0.025);
  }

  .lang-name {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 500;
    text-transform: none;
    border: 1px solid transparent;
  }

  .bar-wrapper {
    position: relative;
    height: 22px;
    background: #1a1d26;
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 3px;
    background: var(--bar);
    box-shadow: 0 0 12px var(--bar-glow);
    width: 0;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .pct {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-primary);
    text-align: right;
    white-space: nowrap;
  }

  /* Category colors */
  [data-cat="web"] .category-badge    { color: var(--cat-web);    background: rgba(167,139,250,0.08); border-color: rgba(167,139,250,0.2); }
  [data-cat="data"] .category-badge   { color: var(--cat-data);   background: rgba(52,211,153,0.08);  border-color: rgba(52,211,153,0.2); }
  [data-cat="shell"] .category-badge  { color: var(--cat-shell);  background: rgba(251,146,60,0.08);  border-color: rgba(251,146,60,0.2); }
  [data-cat="system"] .category-badge { color: var(--cat-system); background: rgba(244,114,182,0.08); border-color: rgba(244,114,182,0.2); }
  [data-cat="general"] .category-badge{ color: var(--cat-general);background: rgba(251,191,36,0.08);  border-color: rgba(251,191,36,0.2); }
  [data-cat="ms"] .category-badge     { color: var(--cat-ms);     background: rgba(96,165,250,0.08);  border-color: rgba(96,165,250,0.2); }

  [data-cat="web"] .bar-fill    { background: #a78bfa; box-shadow: 0 0 14px rgba(167,139,250,0.3); }
  [data-cat="data"] .bar-fill   { background: #34d399; box-shadow: 0 0 14px rgba(52,211,153,0.25); }
  [data-cat="shell"] .bar-fill  { background: #fb923c; box-shadow: 0 0 14px rgba(251,146,60,0.25); }
  [data-cat="system"] .bar-fill { background: #f472b6; box-shadow: 0 0 14px rgba(244,114,182,0.25); }
  [data-cat="general"] .bar-fill{ background: #fbbf24; box-shadow: 0 0 14px rgba(251,191,36,0.25); }
  [data-cat="ms"] .bar-fill     { background: #60a5fa; box-shadow: 0 0 14px rgba(96,165,250,0.25); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Most Used Programming Languages</h1>
    <p>// Stack Overflow Developer Survey · % of respondents who used the language in the past year</p>
  </div>

  <div class="table-head">
    <span class="col-label">Language</span>
    <span class="col-label">Category</span>
    <span class="col-label">Usage</span>
    <span class="col-label" style="text-align:right">%</span>
  </div>

  <div id="chart"></div>
</div>

<script>
const data = [
  { name: "JavaScript", pct: 66.0,  cat: "web",     label: "Web Dev" },
  { name: "HTML / CSS", pct: 61.9,  cat: "web",     label: "Web Dev" },
  { name: "SQL",        pct: 58.6,  cat: "data",    label: "Database / Query" },
  { name: "Python",     pct: 57.9,  cat: "general", label: "General Purpose" },
  { name: "Bash / Shell",pct: 48.7, cat: "shell",   label: "Shell / Scripting" },
  { name: "TypeScript", pct: 43.6,  cat: "web",     label: "Web Dev" },
  { name: "Java",       pct: 29.4,  cat: "general", label: "General Purpose" },
  { name: "C#",         pct: 27.8,  cat: "ms",      label: "Microsoft / Enterprise" },
  { name: "C++",        pct: 23.5,  cat: "system",  label: "Systems" },
  { name: "PowerShell", pct: 23.2,  cat: "shell",   label: "Shell / Scripting" },
  { name: "C",          pct: 22.0,  cat: "system",  label: "Systems" },
  { name: "PHP",        pct: 18.9,  cat: "web",     label: "Web Dev" },
  { name: "Go",         pct: 16.4,  cat: "general", label: "General Purpose" },
  { name: "Rust",       pct: 14.8,  cat: "system",  label: "Systems" },
];

const max = data[0].pct;
const chart = document.getElementById('chart');

data.forEach((d, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.cat = d.cat;

  row.innerHTML = `
    <span class="lang-name">${d.name}</span>
    <span class="category-badge">${d.label}</span>
    <div class="bar-wrapper">
      <div class="bar-fill" data-pct="${(d.pct / max * 100).toFixed(1)}"></div>
    </div>
    <span class="pct">${d.pct}%</span>
  `;
  chart.appendChild(row);
});

// Animate bars
requestAnimationFrame(() => {
  document.querySelectorAll('.bar-fill').forEach((bar, i) => {
    setTimeout(() => {
      bar.style.width = bar.dataset.pct + '%';
    }, i * 60);
  });
});
</script>
</body>
</html>
